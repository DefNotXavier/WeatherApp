name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Start the stack
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up --build -d --wait

      - name: Tests (unit + database)
        env:
          TEST_DATABASE_URL: postgres://montana:dev_db_pw@localhost:5433/montana_planner
        run: go test -race ./...

      - name: Smoke test the running app
        working-directory: .
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "Montana Route Planner"
          curl -fsS http://localhost:8080/api/highways | grep -q LineString
          curl -fsS -X POST http://localhost:8080/api/routes \
            -H 'Content-Type: application/json' \
            -d '{"from":{"lat":46.5958,"lng":-112.027},"to":{"lat":47.1053,"lng":-104.7124}}' \
            | grep -q '"highways":\["I-15","I-90","I-94"\]'

      - name: Logs if something failed
        if: failure()
        working-directory: .
        run: docker compose logs
