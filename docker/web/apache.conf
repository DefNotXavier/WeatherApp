ServerName localhost

# The whole repo gets mounted into the web root, so keep Apache from
# serving .env, the docker files, and the SQL scripts
<DirectoryMatch "^/var/www/html/WeatherApp/(docker|bin|sql_setup|\.git)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(\..*|compose\.yaml|.*\.md)$">
    Require all denied
</FilesMatch>
