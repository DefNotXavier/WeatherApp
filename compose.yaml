name: montana-route-planner

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_ADDR: "redis:6379"
      NWS_USER_AGENT: "${NWS_USER_AGENT}"
    volumes:
      # mount the frontend so HTML/JS/CSS edits show up on refresh
      - ./web:/app/web:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    ports:
      # 5433 so it doesn't fight with a local Postgres on 5432
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # runs the schema, map data, and routing view the first time the db starts
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 so this only passes once the init scripts are done
      # (Postgres only listens on a socket while they run)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
